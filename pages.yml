name: Build and publish the game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
      - name: Install the Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build the C game for browsers
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          mkdir -p _site
          cp -R web/. _site/
          emcc src/game.c -O2 \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=createSnackSneaker \
            -s EXPORTED_FUNCTIONS='["_main","_game_reset","_game_start","_game_choose_hide","_game_choose_walk","_game_back","_game_tick","_game_act","_game_get_screen","_game_get_ending","_game_get_hide","_game_get_walk","_game_get_stage","_game_get_last_stage","_game_get_last_quality","_game_get_suspicion","_game_get_crinkles","_game_get_score","_game_get_cursor","_game_get_target","_game_get_window"]' \
            -s EXPORTED_RUNTIME_METHODS='["cwrap"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o _site/game.js
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
